name: Build Alioth Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      ARCH: arm64
      SUBARCH: arm64
      KERNEL_CONFIG: alioth_defconfig
      CLANG_BRANCH: android11-release
      CLANG_VERSION: r365631c

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt update

          sudo apt install -y \
          git \
          wget \
          curl \
          zip \
          unzip \
          bc \
          bison \
          flex \
          cpio \
          kmod \
          rsync \
          build-essential \
          libssl-dev \
          libelf-dev \
          python3 \
          python-is-python3 \
          python2 \
          gcc-aarch64-linux-gnu \
          binutils-aarch64-linux-gnu \
          gcc-arm-linux-gnueabi \
          binutils-arm-linux-gnueabi

          sudo ln -sf /usr/bin/python2 /usr/bin/python || true

      - name: Create Swap
        run: |
          sudo swapoff -a || true
          sudo rm -f /swapfile || true

          sudo dd if=/dev/zero of=/swapfile bs=1M count=8192
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile

          free -h

      - name: Download Clang
        run: |
          wget -O clang.tar.gz \
          https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/${CLANG_BRANCH}/clang-${CLANG_VERSION}.tar.gz

          mkdir clang

          tar -xzf clang.tar.gz -C clang

      - name: Setup PATH
        run: |
          echo "$GITHUB_WORKSPACE/clang/bin" >> $GITHUB_PATH

      - name: Show Toolchain
        run: |
          clang --version
          aarch64-linux-gnu-gcc --version

      - name: Clone KernelSU
        run: |
          git clone --depth=1 https://github.com/tiann/KernelSU.git KernelSU

          ln -sf ../KernelSU/kernel drivers/kernelsu

          grep -q "kernelsu" drivers/Makefile || \
          echo 'obj-$(CONFIG_KSU) += kernelsu/' >> drivers/Makefile

          grep -q "drivers/kernelsu/Kconfig" drivers/Kconfig || \
          sed -i '/endmenu/i\source "drivers/kernelsu/Kconfig"' drivers/Kconfig

      - name: Create Out Directory
        run: |
          mkdir -p out

      - name: Generate Defconfig
        run: |
          make O=out \
          ARCH=${ARCH} \
          SUBARCH=${SUBARCH} \
          CC=clang \
          LLVM=1 \
          CLANG_TRIPLE=aarch64-linux-gnu- \
          CROSS_COMPILE=aarch64-linux-gnu- \
          CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
          ${KERNEL_CONFIG}

      - name: Enable DroidSpaces Config
        run: |
          echo "CONFIG_PID_NS=y" >> out/.config
          echo "CONFIG_IPC_NS=y" >> out/.config
          echo "CONFIG_DEVTMPFS=y" >> out/.config

          echo "CONFIG_BACKLIGHT_CLASS_DEVICE=y" >> out/.config

          echo "# CONFIG_LTO is not set" >> out/.config
          echo "# CONFIG_LTO_CLANG is not set" >> out/.config
          echo "# CONFIG_THINLTO is not set" >> out/.config
          echo "CONFIG_LTO_NONE=y" >> out/.config

          yes "" | make O=out ARCH=${ARCH} oldconfig

      - name: Build Kernel
        run: |
          make -j1 O=out \
          ARCH=${ARCH} \
          SUBARCH=${SUBARCH} \
          CC=clang \
          LLVM=1 \
          CLANG_TRIPLE=aarch64-linux-gnu- \
          CROSS_COMPILE=aarch64-linux-gnu- \
          CROSS_COMPILE_ARM32=arm-linux-gnueabi-

      - name: Show Build Result
        run: |
          ls -lh out/arch/arm64/boot/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AliothKernel
          path: |
            out/arch/arm64/boot/Image
            out/arch/arm64/boot/Image.gz
            out/arch/arm64/boot/Image.gz-dtb
            out/arch/arm64/boot/dtbo.img