name: Build Alioth Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      ARCH: arm64
      SUBARCH: arm64
      KERNEL_CONFIG: alioth_defconfig

      CLANG_BRANCH: android11-release
      CLANG_VERSION: r365631c

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt update

          sudo apt install -y \
            git \
            wget \
            curl \
            zip \
            unzip \
            bc \
            bison \
            flex \
            cpio \
            kmod \
            rsync \
            build-essential \
            libssl-dev \
            libelf-dev \
            python3 \
            python-is-python3 \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            binutils-arm-linux-gnueabi

      - name: Download Android Clang
        run: |
          wget -O clang.tar.gz \
          https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/${CLANG_BRANCH}/clang-${CLANG_VERSION}.tar.gz

          mkdir clang

          tar -xzf clang.tar.gz -C clang

      - name: Setup Build Environment
        run: |
          echo "$GITHUB_WORKSPACE/clang/bin" >> $GITHUB_PATH

          echo "ARCH=${ARCH}" >> $GITHUB_ENV
          echo "SUBARCH=${SUBARCH}" >> $GITHUB_ENV

          echo "CC=clang" >> $GITHUB_ENV
          echo "LLVM=1" >> $GITHUB_ENV

          echo "CLANG_TRIPLE=aarch64-linux-gnu-" >> $GITHUB_ENV

          echo "CROSS_COMPILE=aarch64-linux-gnu-" >> $GITHUB_ENV
          echo "CROSS_COMPILE_ARM32=arm-linux-gnueabi-" >> $GITHUB_ENV

      - name: Show Toolchain Info
        run: |
          clang --version

          aarch64-linux-gnu-gcc --version

          ld.lld --version

      - name: Prepare Output Directory
        run: |
          mkdir -p out

      - name: Generate Defconfig
        run: |
          make O=out \
          ARCH=${ARCH} \
          SUBARCH=${SUBARCH} \
          CC=clang \
          LLVM=1 \
          CLANG_TRIPLE=aarch64-linux-gnu- \
          CROSS_COMPILE=aarch64-linux-gnu- \
          CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
          ${KERNEL_CONFIG}

      - name: Enable Required Kernel Options
        run: |
          CONFIG_FILE=out/.config

          grep -q "^CONFIG_PID_NS=y" $CONFIG_FILE || \
          echo "CONFIG_PID_NS=y" >> $CONFIG_FILE

          grep -q "^CONFIG_IPC_NS=y" $CONFIG_FILE || \
          echo "CONFIG_IPC_NS=y" >> $CONFIG_FILE

          grep -q "^CONFIG_DEVTMPFS=y" $CONFIG_FILE || \
          echo "CONFIG_DEVTMPFS=y" >> $CONFIG_FILE

          yes "" | make O=out \
          ARCH=${ARCH} \
          oldconfig

      - name: Disable Problematic Options
        run: |
          CONFIG_FILE=out/.config

          sed -i 's/CONFIG_LTO=y/# CONFIG_LTO is not set/g' $CONFIG_FILE || true
          sed -i 's/CONFIG_LTO_CLANG=y/# CONFIG_LTO_CLANG is not set/g' $CONFIG_FILE || true
          sed -i 's/CONFIG_THINLTO=y/# CONFIG_THINLTO is not set/g' $CONFIG_FILE || true

          echo "CONFIG_LTO_NONE=y" >> $CONFIG_FILE

          yes "" | make O=out \
          ARCH=${ARCH} \
          oldconfig

      - name: Build Kernel
        run: |
          make -j4 O=out \
          ARCH=${ARCH} \
          SUBARCH=${SUBARCH} \
          CC=clang \
          LLVM=1 \
          CLANG_TRIPLE=aarch64-linux-gnu- \
          CROSS_COMPILE=aarch64-linux-gnu- \
          CROSS_COMPILE_ARM32=arm-linux-gnueabi-

      - name: Verify Build Result
        run: |
          ls -lah out/arch/arm64/boot/

      - name: Upload Kernel Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Alioth-Kernel

          path: |
            out/arch/arm64/boot/Image
            out/arch/arm64/boot/Image.gz
            out/arch/arm64/boot/Image.gz-dtb
            out/arch/arm64/boot/dtbo.img

          if-no-files-found: warn
